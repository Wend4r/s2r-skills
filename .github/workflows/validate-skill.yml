name: Validate skill

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: custom-hud-layout
          validate-references: 'true'
